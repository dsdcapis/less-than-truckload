          * 320-3   - Appointment Issue - Pending consolidation to full trailer
          * 320-4   - Appointment Issue - Left message requesting appointment
          * 390-1   - Weather - Inclement weather
          * 390-2   - Civil Event - Civil Event
          * 330-1   - Consignee Closed - Consignee closed - reschedule
          * 330-2   - Consignee Closed - Consignee closed due to holiday (dispatcher)
          * 330-3   - Consignee Closed - Consignee closed due to holiday (driver)
          * 450-1   - Duplicate - Duplicate delivery (dispatcher)
          * 450-2   - Duplicate - Duplicate delivery (driver)
          * 400-1   - Delivery request cancelled - Consignee closed - cancel
          * 400-2   - Delivery request cancelled - Customer request to hold at terminal
          * 400-3   - Delivery request cancelled - Customer request to cancel
          * 410-1   - Carrier not able to service - Embargo/capacity constraint
